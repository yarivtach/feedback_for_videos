<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery Test</title>
    <link rel="stylesheet" href="static/css/main.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">Video Gallery</h1>
        
        <div class="video-gallery">
            <!-- Test video item -->
            <div class="video-item">
                <div class="video-container">
                    <img class="video-thumbnail" 
                         src="https://via.placeholder.com/400x300/4CAF50/white?text=Corner+Video" 
                         alt="Corner Video">
                    <div class="play-overlay">
                        <div class="play-button">▶</div>
                    </div>
                </div>
                <div class="video-content">
                    <h3 class="video-title">Corner</h3>
                    <p class="video-info">Size: 30.5 MB</p>
                    <a href="#" class="watch-button">Watch Video</a>
                </div>
            </div>
            
            <!-- Test watched video item -->
            <div class="video-item-watched">
                <div class="video-container">
                    <img class="video-thumbnail" 
                         src="https://via.placeholder.com/400x300/2196F3/white?text=Door+Video" 
                         alt="Door Video">
                    <div class="play-overlay">
                        <div class="play-button">▶</div>
                    </div>
                </div>
                <div class="video-content">
                    <h3 class="video-title">Door</h3>
                    <p class="video-info">Size: 31.2 MB</p>
                    <a href="#" class="watch-button">Watch Video
                        <span class="watched-badge">✓ Watched</span>
                    </a>
                </div>
            </div>
            
            <!-- Test placeholder item -->
            <div class="video-item">
                <div class="video-container">
                    <div class="video-placeholder">
                        <div class="video-icon">▶</div>
                        <p>Obstacles</p>
                    </div>
                </div>
                <div class="video-content">
                    <h3 class="video-title">Obstacles</h3>
                    <p class="video-info">Size: 31.8 MB</p>
                    <a href="#" class="watch-button">Watch Video</a>
                </div>
            </div>
            
            <!-- Test normal item -->
            <div class="video-item">
                <div class="video-container">
                    <img class="video-thumbnail" 
                         src="https://via.placeholder.com/400x300/FF9800/white?text=People+Video" 
                         alt="People Video">
                    <div class="play-overlay">
                        <div class="play-button">▶</div>
                    </div>
                </div>
                <div class="video-content">
                    <h3 class="video-title">People</h3>
                    <p class="video-info">Size: 46.0 MB</p>
                    <a href="#" class="watch-button">Watch Video</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
