<!DOCTYPE html>
<html lang="en">
    {% extends "base.html" %}

{% block title %}Questionnaire{% endblock %}

{% block content %}
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Questionnaire</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    </head>
<body>
    <div class="container">
        <h1>Questionnaire Form</h1>
        <form action="{{ url_for('submit_questionnaire') }}" method="post" id="questionnaireForm" class="questionnaire_form">
            <!-- Hidden field for video_name -->
            <input type="hidden" name="video_name" value="{{ video_name }}">
            
            
            <!-- Safety Question -->
            <label for="safety">Safety:</label><br>
            <label>5 (Good)</label>
            <input type="radio" id="safety" name="safety" value="5">
            <label>4</label>
            <input type="radio" id="safety" name="safety" value="4">
            <label>3</label>
            <input type="radio" id="safety" name="safety" value="3">
            <label>2</label>
            <input type="radio" id="safety" name="safety" value="2">
            <label>1 (Bad)</label>
            <input type="radio" id="safety" name="safety" value="1"><br><br>

            <!-- Speed Question -->
            <label for="speed">Speed:</label><br>
            <label>5 (Good)</label>
            <input type="radio" id="speed" name="speed" value="5">
            <label>4</label>
            <input type="radio" id="speed" name="speed" value="4">
            <label>3</label>
            <input type="radio" id="speed" name="speed" value="3">
            <label>2</label>
            <input type="radio" id="speed" name="speed" value="2">
            <label>1 (Bad)</label>
            <input type="radio" id="speed" name="speed" value="1"><br><br>

            <!-- Convenience Question -->
            <label for="convenience">Convenience:</label><br>
            <label>5 (Good)</label>
            <input type="radio" id="convenience" name="convenience" value="5">
            <label>4</label>
            <input type="radio" id="convenience" name="convenience" value="4">
            <label>3</label>
            <input type="radio" id="convenience" name="convenience" value="3">
            <label>2</label>
            <input type="radio" id="convenience" name="convenience" value="2">
            <label>1 (Bad)</label>
            <input type="radio" id="convenience" name="convenience" value="1"><br><br>

            <!-- Hidden field to store comments collected during the video -->
            <input type="hidden" id="commentsInput" name="comments">
            
            <!-- Hidden field to store feedbacks collected during the video -->
            <input type="hidden" id="feedbacksInput" name="feedbacks">

            <input type="submit" value="Submit">
        </form>
    </div>
    <script>
        window.onload = function() {
            // Retrieve comments from localStorage
            var comments = JSON.parse(localStorage.getItem('comments') || '[]');
            document.getElementById('commentsInput').value = JSON.stringify(comments);
            
            // Retrieve feedbacks from localStorage
            var feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
            document.getElementById('feedbacksInput').value = JSON.stringify(feedbacks);
            
            console.log('📋 Questionnaire loaded with data:');
            console.log('  Comments:', comments.length, 'items');
            console.log('  Feedbacks:', feedbacks.length, 'items');
            
            // Optional: Clear localStorage after retrieving (uncomment if needed)
            // localStorage.removeItem('comments');
            // localStorage.removeItem('feedbacks');
        };
        
        // Add form validation
        document.getElementById('questionnaireForm').addEventListener('submit', function(e) {
            var safety = document.querySelector('input[name="safety"]:checked');
            var speed = document.querySelector('input[name="speed"]:checked');
            var convenience = document.querySelector('input[name="convenience"]:checked');
            
            if (!safety || !speed || !convenience) {
                e.preventDefault();
                alert('Please answer all questions before submitting.');
                return false;
            }
            
            console.log('✅ Submitting questionnaire with ratings:');
            console.log('  Safety:', safety.value);
            console.log('  Speed:', speed.value);
            console.log('  Convenience:', convenience.value);
        });
    </script>

</body>
{% endblock %}
</html>
